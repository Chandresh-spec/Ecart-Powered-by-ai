<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - GroceryStore</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-grid { display: flex; gap: 30px; margin-top: 28px; flex-wrap: wrap; }
        .checkout-form { flex: 2; min-width: 300px; }
        .checkout-summary {
            flex: 1; min-width: 260px; padding: 24px;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            border-radius: var(--radius); height: fit-content;
        }
        .checkout-form h3, .checkout-summary h3 {
            font-size: 18px; font-weight: 700; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .checkout-form h3 i, .checkout-summary h3 i { color: var(--primary); }
        .checkout-form textarea {
            width: 100%; padding: 14px; margin-top: 8px; border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border); background: var(--glass);
            color: var(--text-primary); font-family: inherit; font-size: 14px;
            outline: none; resize: vertical; transition: var(--transition);
        }
        .checkout-form textarea:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .payment-box {
            padding: 16px; border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
            margin-top: 10px; background: var(--glass); color: var(--text-secondary);
            display: flex; align-items: center; gap: 10px;
        }
        .payment-box i { color: var(--primary); font-size: 18px; }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fas fa-leaf logo-icon"></i> Grocery<span>Store</span></a>
            <nav class="nav-links">
                <a href="cart.html" class="nav-link"><i class="fas fa-arrow-left"></i> <span>Back to Cart</span></a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 40px 24px; position: relative; z-index: 1; min-height: 60vh;">
        <div class="section-header">
            <h2><i class="fas fa-credit-card"></i> Checkout</h2>
            <p class="section-sub">Complete your order</p>
        </div>
        <div class="checkout-grid">
            <div class="checkout-form">
                <h3><i class="fas fa-map-marker-alt"></i> Shipping Address</h3>
                <textarea id="shippingAddress" rows="4" placeholder="Enter your full delivery address..."></textarea>
                
                <h3 style="margin-top: 24px;"><i class="fas fa-wallet"></i> Payment Method</h3>
                <div class="payment-box">
                    <i class="fas fa-credit-card"></i>
                    <label><input type="radio" checked style="accent-color: var(--primary);"> Mock Credit/Debit Card</label>
                </div>
            </div>
            
            <div class="checkout-summary">
                <h3><i class="fas fa-receipt"></i> Order Summary</h3>
                <div id="checkoutSummary" style="font-weight: 600; font-size: 18px; color: var(--text-secondary);">
                    Loading...
                </div>
                <button class="btn-primary" style="width:100%; margin-top: 20px; justify-content: center; padding: 14px;" onclick="placeOrder()">
                    <i class="fas fa-check-circle"></i> Place Order
                </button>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
