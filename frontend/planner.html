<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meal Planner - GroceryStore</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .planner-card {
            background: var(--bg-card); border: 1px solid var(--glass-border);
            border-radius: var(--radius); padding: 28px; margin-top: 28px;
        }
        .planner-card p { color: var(--text-secondary); margin-bottom: 18px; font-size: 15px; }
        .planner-input-row { display: flex; gap: 12px; }
        .planner-input-row input {
            flex: 1; padding: 14px 18px; border: 1px solid var(--glass-border);
            border-radius: 12px; background: var(--glass); color: var(--text-primary);
            font-size: 15px; outline: none; font-family: inherit; transition: var(--transition);
        }
        .planner-input-row input:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .planner-input-row input::placeholder { color: var(--text-muted); }
        .result-box {
            margin-top: 28px; display: none; background: var(--bg-card);
            border: 1px solid var(--glass-border); border-radius: var(--radius);
            padding: 24px; white-space: pre-line; line-height: 1.7;
            color: var(--text-secondary); font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fas fa-leaf logo-icon"></i> Grocery<span>Store</span></a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link"><i class="fas fa-arrow-left"></i> <span>Back to Home</span></a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 40px 24px; position: relative; z-index: 1; min-height: 60vh;">
        <div class="section-header">
            <h2><i class="fas fa-wand-magic-sparkles"></i> AI Meal Planner</h2>
            <p class="section-sub">Let AI suggest recipes and shopping lists for you</p>
        </div>
        
        <div class="planner-card">
            <p><i class="fas fa-lightbulb" style="color:var(--primary);"></i> Enter what kind of meal you want, or your dietary preferences, and our AI will generate a recipe with ingredients.</p>
            <div class="planner-input-row">
                <input type="text" id="mealPrompt" placeholder="e.g. Healthy high protein dinner for 2">
                <button class="btn-primary" onclick="generateMeal()" style="white-space:nowrap;">
                    <i class="fas fa-sparkles"></i> Generate
                </button>
            </div>
        </div>

        <div id="plannerResult" class="result-box"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/planner.js"></script>
</body>
</html>
