<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store - Online Grocery Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Grocery<span>Store</span></a>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search for products (Try 'eggs under 50' for AI Search!)...">
                <button onclick="performSearch()"><i class="fas fa-search"></i></button>
            </div>
            
            <div class="nav-links">
                <a href="planner.html">AI Meal Planner</a>
                <a href="#" id="loginBtn" onclick="toggleAuthModal()">Login / Sign Up</a>
                <a href="cart.html" class="cart-btn" id="navCartBtn" style="display:none;">
                    <i class="fas fa-shopping-basket"></i>
                    <span id="cartCount">0</span>
                </a>
                <a href="#" id="logoutBtn" onclick="logout()" style="display:none;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </header>

    <!-- Categories Nav -->
    <nav class="categories-nav">
        <ul id="categoryList">
            <li><a href="#" class="active" onclick="filterCategory('')">All</a></li>
            <!-- Categories injected here -->
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <!-- Banner -->
        <section class="banner">
            <div class="banner-content">
                <h2>Fresh Groceries, Delivered Fast!</h2>
                <p>Save up to 40% on daily essentials with our premium delivery service.</p>
                <button class="btn main-btn">Shop Now</button>
            </div>
        </section>

        <!-- Product Grid -->
        <section class="products-section">
            <div class="section-header">
                <h3>Trending Products</h3>
            </div>
            <div class="product-grid" id="productGrid">
                <!-- Products will be injected here via JS -->
            </div>
        </section>
    </main>

    <!-- Chatbot Widget -->
    <div class="chatbot-widget">
        <div class="chat-header" onclick="toggleChat()">
            <div><i class="fas fa-robot"></i> AI Assistant</div>
            <i class="fas fa-chevron-up" id="chatToggleIcon"></i>
        </div>
        <div class="chat-body" id="chatBody" style="display: none;">
            <div class="messages" id="chatMessages">
                <div class="msg ai">Hello! I am your AI grocery assistant. How can I help you today?</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInputMsg" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close" onclick="toggleAuthModal()">&times;</span>
            <div class="tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">Login</button>
                <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">Register</button>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="text" id="l_username" placeholder="Username" required>
                <input type="password" id="l_password" placeholder="Password" required>
                <button type="submit" class="btn block-btn">Login</button>
            </form>

            <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
                <input type="text" id="r_username" placeholder="Username" required>
                <input type="email" id="r_email" placeholder="Email" required>
                <input type="password" id="r_password" placeholder="Password" required>
                <button type="submit" class="btn block-btn">Register</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
